  .mono { font-family:'JetBrains Mono','Courier New',monospace; letter-spacing:-0.01em; }
  input[type=date], input[type=datetime-local] { color:#E7EAF2; color-scheme: dark; }
  ::placeholder { color:#8993A8; opacity:0.65; }
  ::selection { background:#4C8DF5; color:#0B1220; }
  button, a, input, [role=button] { -webkit-tap-highlight-color: transparent; }
  button:focus-visible, a:focus-visible, input:focus-visible {
    outline: 2px solid #4C8DF5; outline-offset: 2px;
  }
  input, textarea { color-scheme: dark; }

  /* Elevation: card-container surfaces get a hairline border + soft shadow + faint
     top highlight, so surfaces read as "raised" instead of flat rectangles. Scoped to
     <div> only — inputs/buttons sharing the same fill color should stay flat/recessed,
     not look like raised cards. Targeting the compiled utility class directly means
     every real card in the app gets this in one place, rather than editing ~70
     individual template strings. */
  div.bg-\[\#131B2E\] {
    border: 1px solid rgba(231,234,242,0.07);
    box-shadow: 0 1px 0 0 rgba(255,255,255,0.03) inset, 0 8px 20px -12px rgba(0,0,0,0.55);
  }

  /* Tabular numerals for money/quantities — digits line up like a real ledger/terminal. */
  .mono { font-variant-numeric: tabular-nums; }

  /* Screen transitions: only fires on real navigation (see screenChanged in render()),
     not on every keystroke/tap re-render, so typing and toggling stays instant. */
  @keyframes screen-enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .screen-enter { animation: screen-enter 0.22s cubic-bezier(0.16,1,0.3,1); }

  /* Global tap/press feedback — every button and link in the app gets a subtle
     press-down effect automatically, without editing each of the ~50+ button templates. */
  button, a[href], [role=button] { transition: transform 0.1s ease, filter 0.1s ease, opacity 0.1s ease; }
  button:active:not(:disabled), a[href]:active, [role=button]:active {
    transform: scale(0.96); filter: brightness(0.88);
  }
  @media (hover: hover) {
    button:hover:not(:disabled), a[href]:hover { filter: brightness(1.08); }
  }
</style>
</head>
<body>
<div id="app" class="min-h-screen flex flex-col"></div>
<script>
// Load the Google Fonts stylesheet asynchronously so the app never waits on the network
// to paint — it shows instantly with system-font fallbacks (see .ink/.mono above), then
// swaps to the custom fonts the moment they're available. On a slow or offline connection
// this fails silently and the app just keeps using the fallback fonts.
(function(){
  try {
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap';
    link.onerror = function(){ /* offline — fallback fonts already active, nothing to do */ };
    document.head.appendChild(link);
  } catch(e) {}
})();
</script>

<script>
// ===================== STORAGE (localStorage, no server, no login) =====================
const CUSTOMERS_KEY = 'khata_customers_list';
const txnKey = (id) => 'khata_txns_' + id;
const BACKUP_META_KEY = 'khata_last_backup';
const STOCK_KEY = 'khata_stock_totals';
const NUMERAL_STYLE_KEY = 'khata_numeral_style'; // 'latin' (default) or 'deva'

function loadNumeralStyle(){ return localStorage.getItem(NUMERAL_STYLE_KEY) || 'latin'; }
function saveNumeralStyle(v){ localStorage.setItem(NUMERAL_STYLE_KEY, v); }
const DEVA_DIGITS = ['०','१','२','३','४','५','६','७','८','९'];
function toDevaDigits(str){
  return String(str).replace(/[0-9]/g, d => DEVA_DIGITS[Number(d)]);
}
// Use this specifically for amounts drawn on the bill/receipt image, so the person
// can choose Devanagari numerals there without changing the rest of the app.
function fmtINRForBill(amount){
  const s = Math.round(amount).toLocaleString('en-IN');
  return loadNumeralStyle()==='deva' ? toDevaDigits(s) : s;
}

function loadStock(){ try { return JSON.parse(localStorage.getItem(STOCK_KEY) || '{}'); } catch { return {}; } }
function saveStock(obj){ try { localStorage.setItem(STOCK_KEY, JSON.stringify(obj)); } catch { warnStorageFailure(); } }

const RATES_KEY = 'khata_rate_overrides';
function loadRates(){ try { return JSON.parse(localStorage.getItem(RATES_KEY) || '{}'); } catch { return {}; } }
function saveRates(obj){ try { localStorage.setItem(RATES_KEY, JSON.stringify(obj)); } catch { warnStorageFailure(); } }
// Your actual working rate for a product: your saved override if you've set one,
// otherwise the built-in starting default.
function getRate(productName){
  const overrides = loadRates();
  if (productName in overrides) return overrides[productName];
  const cfg = PRODUCT_CONFIG.find(p=>p.name===productName);
  return cfg ? cfg.defaultRate : 0;
}

function loadCustomers() {
  try { return JSON.parse(localStorage.getItem(CUSTOMERS_KEY) || '[]'); } catch { return []; }
}
function makeId(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function saveCustomers(list) {
  try { localStorage.setItem(CUSTOMERS_KEY, JSON.stringify(list)); return true; }
  catch (err) { warnStorageFailure(); return false; }
}
function loadTxns(id) {
  try { return JSON.parse(localStorage.getItem(txnKey(id)) || '[]'); } catch { return []; }
}
function saveTxns(id, list) {
  try { localStorage.setItem(txnKey(id), JSON.stringify(list)); return true; }
  catch (err) { warnStorageFailure(); return false; }
}
let storageWarnedRecently = false;
function warnStorageFailure() {
  // Storage is full (often because of saved photos) — tell the user instead of silently losing their entry.
  if (storageWarnedRecently) return;
  storageWarnedRecently = true;
  setTimeout(()=>{ storageWarnedRecently = false; }, 5000);
  showToast('⚠️ Storage full — this was NOT saved. Remove old photos or backup & clear some data.');
}

// ---- Full backup / restore ----
function exportBackup() {
  const data = { customers: loadCustomers(), txns: {}, exportedAt: new Date().toISOString() };
  data.customers.forEach(c => { data.txns[c.id] = loadTxns(c.id); });
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `rental-khata-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  localStorage.setItem(BACKUP_META_KEY, new Date().toISOString());
  showToast('Backup file downloaded');
}
function importBackupFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.customers) throw new Error('bad file');
      const n = data.customers.length;
      if (!confirm(`Restore this backup? This will REPLACE all ${state.customers.length} customer(s) currently on this phone with the ${n} customer(s) from the backup file. This cannot be undone.`)) return;
      saveCustomers(data.customers);
      Object.keys(data.txns || {}).forEach(cid => saveTxns(cid, data.txns[cid]));
      localStorage.setItem(BACKUP_META_KEY, new Date().toISOString());
      showToast('Backup restored');
      state.customers = loadCustomers();
      render();
    } catch (err) {
      showToast('Invalid backup file');
    }
  };
  reader.readAsText(file);
}
function daysSinceBackup() {
  const last = localStorage.getItem(BACKUP_META_KEY);
  if (!last) return Infinity;
  return Math.floor((Date.now() - new Date(last).getTime()) / 86400000);
}

// ===================== RECEIPT / BILL SHARING (Hindi, with logo, shared as image) =====================
const COMPANY_NAME_HI = 'अंकित कंस्ट्रक्शन';
const COMPANY_TAGLINE_HI = 'निर्माण सामग्री किराया सेवा';
const COMPANY_ADDRESS_HI = 'रामडीह (परैया)';
const COMPANY_CARE_NUMBER = '9162831344';
const COMPANY_CARE_NUMBER_2 = '7781857242';
const UPI_ID = '9162831344@axl';
const UPI_PAYEE_NAME = 'Ankit Kumar';

function buildUpiLink(amount, note){
  const amt = amount > 0 ? Number(amount).toFixed(2) : '';
  return `upi://pay?pa=${encodeURIComponent(UPI_ID)}&pn=${encodeURIComponent(UPI_PAYEE_NAME)}&am=${amt}&cu=INR&tn=${encodeURIComponent(note||'Rental payment')}`;
}

// Draw a QR code directly onto an existing canvas context (used for embedding in receipts)
function drawQrOnCanvas(ctx, data, x, y, size){
  const qr = qrcode(0, 'M');
  qr.addData(data);
  qr.make();
  const count = qr.getModuleCount();
  const cell = size / count;
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(x, y, size, size);
  ctx.fillStyle = '#000000';
  for (let r=0; r<count; r++){
    for (let c=0; c<count; c++){
      if (qr.isDark(r,c)) ctx.fillRect(x + c*cell, y + r*cell, Math.ceil(cell)+0.5, Math.ceil(cell)+0.5);
    }
  }
}

// Build a standalone QR image (data URL) for the on-screen "show to customer" modal
function buildQrDataUrl(data){
  const qr = qrcode(0, 'M');
  qr.addData(data);
  qr.make();
  return qr.createDataURL(8, 8);
}

function drawCompanyLogo(ctx, cx, cy, r){
  // Badge circle
  const grad = ctx.createLinearGradient(cx-r, cy-r, cx+r, cy+r);
  grad.addColorStop(0, '#b23a3a');
  grad.addColorStop(1, '#25344f');
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.lineWidth = r*0.06;
  ctx.strokeStyle = '#f3ecd9';
  ctx.stroke();

  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#f3ecd9';
  // Bold, clean serif — much more legible at small sizes than a script font
  ctx.font = `700 ${Math.round(r*0.92)}px Georgia, 'Times New Roman', serif`;
  ctx.fillText('AC', cx, cy - r*0.14);

  // Small brick-course accent beneath the initials — a construction motif
  // instead of a plain underline
  const brickW = r*0.32, brickH = r*0.15, gap = r*0.065;
  const totalW = brickW*3 + gap*2;
  const startX = cx - totalW/2;
  const by = cy + r*0.34;
  ctx.fillRect(startX, by, brickW, brickH);
  ctx.fillRect(startX + brickW + gap, by, brickW, brickH);
  ctx.fillRect(startX + (brickW+gap)*2, by, brickW, brickH);
  ctx.restore();
}

function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight, align){
  const words = text.split(' ');
  let line = '';
  let lines = [];
  for (let n=0; n<words.length; n++){
    const test = line + words[n] + ' ';
    if (ctx.measureText(test).width > maxWidth && n > 0){
      lines.push(line.trim()); line = words[n] + ' ';
    } else line = test;
  }
  lines.push(line.trim());
  lines.forEach((l,i)=>{ ctx.fillText(l, x, y + i*lineHeight); });
  return y + lines.length*lineHeight;
}

function drawReceiptContent(ctx, W, H, c, entries, isBill){
  ctx.fillStyle = '#f7f2e7';
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = 'rgba(37,52,79,0.3)';
  ctx.lineWidth = 3;
  ctx.strokeRect(14,14,W-28,H-28);

  drawCompanyLogo(ctx, W/2, 100, 62);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#25344f';
  ctx.font = "bold 40px 'Noto Sans Devanagari', sans-serif";
  ctx.fillText(COMPANY_NAME_HI, W/2, 205);
  ctx.font = "18px 'Noto Sans Devanagari', sans-serif";
  ctx.fillStyle = '#8b7355';
  ctx.fillText(COMPANY_TAGLINE_HI, W/2, 232);
  ctx.font = "16px 'Noto Sans Devanagari', sans-serif";
  ctx.fillStyle = '#8b7355';
  ctx.fillText('📍 ' + COMPANY_ADDRESS_HI, W/2, 256);
  ctx.font = "16px 'Noto Sans Devanagari', sans-serif";
  ctx.fillStyle = '#8b7355';
  ctx.fillText(isBill ? 'किराया बिल (Rental Bill)' : 'किराया रसीद (Rental Receipt)', W/2, 282);

  ctx.strokeStyle = 'rgba(37,52,79,0.25)';
  ctx.beginPath(); ctx.moveTo(50,306); ctx.lineTo(W-50,306); ctx.stroke();

  let y = 344;
  const rowH = 34;
  ctx.textAlign = 'left';

  function line(label, value, opts={}){
    ctx.font = opts.bold ? "bold 22px 'Noto Sans Devanagari', sans-serif" : "20px 'Noto Sans Devanagari', sans-serif";
    ctx.fillStyle = opts.color || '#25344f';
    ctx.textAlign = 'left';
    ctx.fillText(label, 50, y);
    ctx.textAlign = 'right';
    ctx.fillText(value, W-50, y);
    ctx.textAlign = 'left';
    y += opts.gap || 34;
  }
  function divider(){
    ctx.strokeStyle='rgba(37,52,79,0.2)';
    ctx.beginPath(); ctx.moveTo(50,y); ctx.lineTo(W-50,y); ctx.stroke();
    y += 30;
  }

  line('ग्राहक का नाम:', c.name);
  if (c.phone) line('फ़ोन नंबर:', c.phone);
  if (c.address) line('पता:', c.address);
  divider();

  let grandTotal=0, grandPaid=0;

  if (isBill){
    ctx.font="bold 20px 'Noto Sans Devanagari', sans-serif";
    ctx.fillStyle='#25344f';
    ctx.fillText('किराया विवरण (Entries)', 50, y);
    y += 32;

    if (entries.length === 0) {
      ctx.font = "17px 'Noto Sans Devanagari', sans-serif";
      ctx.fillStyle = '#2f6b4f';
      ctx.fillText('✓ फिलहाल कोई बकाया नहीं — सब कुछ वापस व भुगतान पूर्ण', 50, y);
      y += 34;
    }

    entries.forEach((t, idx) => {
      const m = txnMath(t);
      grandTotal += m.total; grandPaid += m.paid;
      const isSettled = m.due <= 0 && !m.notYetStarted;

      ctx.font="bold 17px 'Noto Sans Devanagari', sans-serif";
      ctx.fillStyle='#25344f';
      ctx.textAlign='left';
      ctx.fillText(`${idx+1}) ${fmtDateTime(t.dateGiven)}${m.notYetStarted ? ' (बुक — अभी नहीं दिया)' : ''} · ${m.days} दिन`, 50, y);
      ctx.textAlign='right';
      ctx.fillText('₹'+fmtINRForBill(m.total), W-50, y);
      ctx.textAlign='left';
      y += 27;

      if (isSettled){
        // Already fully returned and paid — just a brief closed-out line, not the full breakdown
        ctx.font="15px 'Noto Sans Devanagari', sans-serif";
        ctx.fillStyle='#2f6b4f';
        const itemSummary = m.items.map(i=>`${i.product} ×${i.qty}`).join(', ');
        const line1 = `✓ पूरा वापस व भुगतान — ${itemSummary}`;
        ctx.fillText(line1.length>62 ? line1.slice(0,60)+'…' : line1, 65, y);
        y += 22;
      } else {
        m.items.forEach(i=>{
          let statusTxt;
          if (m.notYetStarted) statusTxt = 'अभी नहीं दिया गया';
          else if (i.remaining<=0) statusTxt = `सब वापस (${(i.returns||[]).map(r=>fmtDateTime(r.date)).join(', ')})`;
          else if (i.returnedQty>0) statusTxt = `${i.returnedQty} वापस (${(i.returns||[]).map(r=>fmtDateTime(r.date)).join(', ')}), ${i.remaining} अभी बाकी`;
          else statusTxt = `${i.remaining} अभी बाकी (जारी)`;

          ctx.font="16px 'Noto Sans Devanagari', sans-serif";
          ctx.fillStyle='#25344f';
          ctx.textAlign='left';
          ctx.fillText(`${i.product} ×${i.qty} (₹${fmtINRForBill(i.rate)}/दिन)`, 65, y);
          ctx.textAlign='right';
          ctx.fillText('₹'+fmtINRForBill(displayItemTotal(i, m)), W-50, y);
          ctx.textAlign='left';
          y += 20;

          ctx.font="16px 'Noto Sans Devanagari', sans-serif";
          ctx.fillStyle='#6b5535';
          ctx.fillText(statusTxt.length>75 ? statusTxt.slice(0,73)+'…' : statusTxt, 70, y);
          y += 25;
        });
      }
      y += 10;
    });
    divider();
    line('कुल किराया (Total):', '₹'+fmtINRForBill(grandTotal), {bold:true});
    line('कुल भुगतान (Paid):', '₹'+fmtINRForBill(grandPaid));
  } else {
    const t = entries[0];
    const m = txnMath(t);
    grandTotal = m.total; grandPaid = m.paid;

    ctx.font="bold 20px 'Noto Sans Devanagari', sans-serif";
    ctx.fillStyle='#25344f';
    ctx.fillText('सामान (Item)', 50, y);
    ctx.textAlign='right'; ctx.fillText('राशि', W-50, y); ctx.textAlign='left';
    y += 30;
    m.items.forEach(i=>{
      ctx.font="18px 'Noto Sans Devanagari', sans-serif";
      const returnDates = (i.returns||[]).map(r=>fmtDateTime(r.date)).join(', ');
      const statusTxt = i.remaining>0 ? (i.returnedQty>0 ? ` (${i.returnedQty} वापस ${returnDates}, ${i.remaining} बाकी)` : ' (जारी)') : ` (वापस ${returnDates})`;
      ctx.fillText(`${i.product} ×${i.qty} (₹${i.rate}/दिन)`, 50, y);
      ctx.textAlign='right';
      ctx.fillText('₹'+fmtINRForBill(displayItemTotal(i, m)), W-50, y);
      ctx.textAlign='left';
      y += 22;
      ctx.font="16px 'Noto Sans Devanagari', sans-serif";
      ctx.fillStyle='#6b5535';
      ctx.fillText(statusTxt.trim(), 65, y);
      ctx.fillStyle='#25344f';
      y += 30;
    });
    divider();
    line('दिया गया (Given):', fmtDateTime(t.dateGiven));
    line('स्थिति (Status):', m.status==='returned'?'पूरा वापस':m.status==='partial'?'आंशिक वापस':'ग्राहक के पास');
    line('कुल दिन (Days):', `${m.days} दिन${m.manualDays!=null ? ' (manually set)' : ''}`);
    divider();
    line('कुल किराया (Total):', '₹'+fmtINRForBill(m.total), {bold:true});
    line('एडवांस (Advance):', '₹'+fmtINRForBill(Number(t.advance||0)));
    const otherPay = (t.payments||[]).reduce((s,p)=>s+Number(p.amount),0);
    if (otherPay>0) line('अन्य भुगतान (Other):', '₹'+fmtINRForBill(otherPay));
  }

  y += 8;
  ctx.strokeStyle = '#25344f'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(50,y); ctx.lineTo(W-50,y); ctx.stroke();
  y += 42;

  const due = grandTotal - grandPaid;
  ctx.font = "bold 28px 'Noto Sans Devanagari', sans-serif";
  if (due > 0){
    ctx.fillStyle = '#b23a3a';
    ctx.textAlign='left'; ctx.fillText('बकाया राशि:', 50, y);
    ctx.textAlign='right'; ctx.fillText('₹'+fmtINRForBill(due), W-50, y);
  } else if (due < 0){
    ctx.fillStyle = '#2f6b4f';
    ctx.textAlign='left'; ctx.fillText('अतिरिक्त भुगतान:', 50, y);
    ctx.textAlign='right'; ctx.fillText('₹'+fmtINRForBill(Math.abs(due)), W-50, y);
  } else {
    ctx.fillStyle = '#2f6b4f';
    ctx.textAlign='center';
    ctx.fillText('पूरा भुगतान हो गया ✓', W/2, y);
  }

  if (due > 0){
    y += 40;
    ctx.font = "16px 'Noto Sans Devanagari', sans-serif";
    ctx.fillStyle = '#25344f';
    ctx.textAlign = 'center';
    ctx.fillText('स्कैन करके भुगतान करें (Scan to Pay)', W/2, y);
    y += 20;
    const qrSize = 240;
    drawQrOnCanvas(ctx, buildUpiLink(due, `${c.name} - Rental`), W/2 - qrSize/2, y, qrSize);
    y += qrSize + 24;
    ctx.font = "14px 'Noto Sans Devanagari', sans-serif";
    ctx.fillStyle = '#8b7355';
    ctx.fillText(UPI_PAYEE_NAME + ' • ' + UPI_ID, W/2, y);
    y += 10;
  }

  y += 60;
  ctx.font = "italic 18px 'Noto Sans Devanagari', sans-serif";
  ctx.fillStyle = '#8b7355';
  ctx.textAlign = 'center';
  ctx.fillText('धन्यवाद! — ' + COMPANY_NAME_HI, W/2, y);

  y += 30;
  ctx.font = "16px 'Noto Sans Devanagari', sans-serif";
  ctx.fillStyle = '#25344f';
  ctx.fillText('📞 ग्राहक सेवा (Customer Care): ' + COMPANY_CARE_NUMBER + ' / ' + COMPANY_CARE_NUMBER_2, W/2, y);

  y += 26;
  ctx.font = "12px 'Noto Sans Devanagari', sans-serif";
  ctx.fillStyle = '#8b7355';
  ctx.fillText('बिल बनाया गया (Generated): ' + fmtDateTime(nowISO()), W/2, y);

  return y + 30; // final content height including bottom breathing room
}

function getBillEntries(txns){
  // If some entries are still pending, leave off the already-closed ones so they
  // don't clutter/confuse the picture. But if EVERYTHING is settled, there's nothing
  // to declutter against — show the full history so a "fully paid" bill still works
  // as a real receipt of what was rented, not a blank "nothing owed" message.
  const pending = txns.filter(t=>{
    const m = txnMath(t);
    const isSettled = m.due <= 0 && !m.notYetStarted;
    return !isSettled;
  });
  return pending.length > 0 ? pending : txns;
}

function buildReceiptCanvas(c, entries, isBill){
  const W = 800;
  const RENDER_SCALE = 2; // draw at 2x pixel density so it stays sharp when zoomed or re-compressed by WhatsApp

  // Pass 1: draw onto a generously tall scratch canvas purely to measure the real content height
  // (the number of lines varies with phone/address/items/payments, so a fixed-height guess isn't reliable)
  const scratch = document.createElement('canvas');
  scratch.width = W; scratch.height = 3000;
  const measuredH = drawReceiptContent(scratch.getContext('2d'), W, 3000, c, entries, isBill);

  // Pass 2: draw again onto a canvas sized exactly to fit, at higher pixel density
  const canvas = document.createElement('canvas');
  canvas.width = W*RENDER_SCALE; canvas.height = measuredH*RENDER_SCALE;
  const ctx = canvas.getContext('2d');
  ctx.scale(RENDER_SCALE, RENDER_SCALE);
  drawReceiptContent(ctx, W, measuredH, c, entries, isBill);

  return canvas;
}

async function shareCanvasAsImage(canvas, filename, title){
  const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
  const file = new File([blob], filename, { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })){
    try { await navigator.share({ files: [file], title }); return; } catch(e){ /* cancelled */ return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('रसीद डाउनलोड हुई — WhatsApp में भेजें');
}

function resizeImageForStorage(file, maxDim, quality){
  maxDim = maxDim || 300; quality = quality || 0.6;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if (w > h) { if (w > maxDim) { h = Math.round(h*maxDim/w); w = maxDim; } }
        else { if (h > maxDim) { w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function nowLocalInput() {
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function nowISO(){ return new Date().toISOString(); }
function daysBetween(a,b){
  // Plain calendar-date subtraction. e.g. 11 Jul -> 20 Jul = 9 days, regardless of what time
  // it was picked up or returned — no extra day added for crossing into the next day late.
  const d1 = new Date(a);
  const d2 = new Date(b);
  if (d1 > d2) return 0; // rental hasn't started yet (given date is in the future)
  const date1 = new Date(d1.getFullYear(), d1.getMonth(), d1.getDate());
  const date2 = new Date(d2.getFullYear(), d2.getMonth(), d2.getDate());
  const diff = Math.round((date2 - date1) / 86400000);
  return Math.max(diff, 1);
}
function dateOnlyDate(d){
  const dt = new Date(d);
  return new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
}

// A calendar day only "properly starts" once it's past noon — checking early in the morning
// shouldn't yet count that day as billable. Never shifts back to or before the given date itself.
function billingEndDate(rawDate, givenD){
  const raw = dateOnlyDate(rawDate);
  if (dateOnlyKey(raw) === dateOnlyKey(givenD)) return raw;
  if (new Date(rawDate).getHours() < 12){
    const shifted = new Date(raw);
    shifted.setDate(shifted.getDate() - 1);
    return shifted < givenD ? givenD : shifted;
  }
  return raw;
}

// ===================== MONEY CALC =====================
// Two different billing models:
//  - "Simple" (plain subtraction): used for Plate(3x2'), Bamboo/Balli, Channel — but ONLY when
//    all three appear together in the same entry (the shuttering combo). e.g. 11->20 Jul = 9 days flat.
//  - "Level-based" (day-by-day): used for everything else, and for those same three products
//    whenever they're NOT all rented together as a combo. Each calendar day is billed at whatever
//    quantity was actually held that day — a partial return's day already counts at the reduced qty.
function isComboProduct(productName){
  if (productName === 'Bamboo / Balli') return true;
  if (productName === 'Channel') return true;
  if (productName.startsWith('Plate (') && productName.includes('3×2')) return true;
  return false;
}

// When a manual day-count override is set, each item's own displayed amount should reflect
// that same override too — otherwise the per-item lines never add up to the overall total shown.
function displayItemTotal(item, m){
  if (m.manualTotal != null){
    const weightSum = m.items.reduce((s,i)=> s + Number(i.qty)*Number(i.rate), 0) || 1;
    return roundClean(m.manualTotal * (Number(item.qty)*Number(item.rate)) / weightSum);
  }
  return m.manualDays != null ? Number(item.qty) * Number(item.rate) * m.manualDays : item.total;
}

function simpleItemMath(item, dateGiven, nowFallback){
  const returns = (item.returns||[]).slice().sort((a,b)=> new Date(a.date)-new Date(b.date));
  let remaining = Number(item.qty);
  let total = 0;
  returns.forEach(r=>{
    const qtyThis = Math.min(Number(r.qty), remaining);
    if (qtyThis <= 0) return;
    const days = daysBetween(dateGiven, r.date);
    total += qtyThis * Number(item.rate) * days;
    remaining -= qtyThis;
  });
  if (remaining > 0){
    const days = daysBetween(dateGiven, nowFallback);
    total += remaining * Number(item.rate) * days;
  }
  return { total, remaining, returnedQty: Number(item.qty) - remaining, returns };
}

function levelBasedItemMath(item, dateGiven, nowFallback){
  const totalQty = Number(item.qty);
  const returns = (item.returns||[]).slice().sort((a,b)=> new Date(a.date)-new Date(b.date));
  const sumReturned = returns.reduce((s,r)=> s + Number(r.qty), 0);
  const remaining = Math.max(totalQty - sumReturned, 0);

  const givenD = dateOnlyDate(dateGiven);
  const endD = (remaining<=0 && returns.length>0) ? billingEndDate(returns[returns.length-1].date, givenD) : billingEndDate(nowFallback, givenD);

  if (givenD > endD){
    return { total: 0, remaining, returnedQty: totalQty-remaining, returns };
  }

  const givenKey = dateOnlyKey(givenD);
  const changesByDate = {};
  returns.forEach(r=>{
    let effectiveDate = dateOnlyDate(r.date);
    // A return on the SAME calendar day it was given doesn't reduce that founding day's billing —
    // the founding day always counts at the full quantity that was actually handed over.
    // The reduction takes effect starting the next day instead.
    if (dateOnlyKey(effectiveDate) === givenKey){
      effectiveDate = new Date(effectiveDate);
      effectiveDate.setDate(effectiveDate.getDate() + 1);
    }
    const key = dateOnlyKey(effectiveDate);
    changesByDate[key] = (changesByDate[key]||0) + Number(r.qty);
  });

  let currentQty = totalQty;
  let total = 0;
  const cursor = new Date(givenD);
  let iterations = 0;
  while (cursor <= endD && iterations < 20000){
    const key = dateOnlyKey(cursor);
    if (changesByDate[key]) currentQty = Math.max(currentQty - changesByDate[key], 0);
    total += currentQty * Number(item.rate);
    cursor.setDate(cursor.getDate()+1);
    iterations++;
  }
  return { total, remaining, returnedQty: totalQty-remaining, returns };
}

function txnMath(t){
  const now = nowISO();
  const rawItems = t.items||[];
  const hasPlate32 = rawItems.some(i=> i.product.startsWith('Plate (') && i.product.includes('3×2'));
  const hasBamboo = rawItems.some(i=> i.product==='Bamboo / Balli');
  const hasChannel = rawItems.some(i=> i.product==='Channel');
  const comboActive = hasPlate32 && (hasBamboo || hasChannel); // Plate(3x2') + Bamboo, or Plate(3x2') + Channel, or all three — any of these trigger the simple rule

  const items = rawItems.map(item=>{
    const useSimple = comboActive && isComboProduct(item.product);
    const im = useSimple ? simpleItemMath(item, t.dateGiven, now) : levelBasedItemMath(item, t.dateGiven, now);
    return { ...item, ...im };
  });
  const perDayCost = items.reduce((s,i)=> s + Number(i.qty)*Number(i.rate), 0);
  const manualDays = (t.manualDays != null && Number(t.manualDays) > 0) ? Number(t.manualDays) : null;
  const manualTotal = (t.manualTotal != null && Number(t.manualTotal) > 0) ? Number(t.manualTotal) : null;
  const total = manualTotal != null ? manualTotal : (manualDays != null ? perDayCost * manualDays : items.reduce((s,i)=> s + i.total, 0));
  const allReturned = items.length>0 && items.every(i=> i.remaining<=0);
  const anyReturned = items.some(i=> i.returnedQty>0);
  const notYetStarted = new Date(t.dateGiven) > new Date(now);
  const status = notYetStarted ? 'booked' : allReturned ? 'returned' : anyReturned ? 'partial' : 'ongoing';
  // Kept for places that still want a single "days" figure — based on overall span so far.
  // Once everything's back, this must freeze at the last return date, not keep counting
  // toward "today" — otherwise the days shown here drift away from what was actually billed.
  let latestReturnDate = t.dateGiven;
  items.forEach(i=> (i.returns||[]).forEach(r=> { if (new Date(r.date) > new Date(latestReturnDate)) latestReturnDate = r.date; }));
  const days = manualDays != null ? manualDays
    : allReturned ? daysBetween(t.dateGiven, latestReturnDate)
    : daysBetween(t.dateGiven, now);
  const paidExtra = (t.payments||[]).reduce((s,p)=> s + Number(p.amount), 0);
  const waived = Number(t.waived||0);
  const paid = Number(t.advance||0) + paidExtra + waived;
  const due = total - paid;
  return { days, perDayCost, total, paid, due, items, status, allReturned, manualDays, manualTotal, waived, notYetStarted };
}

// ===================== CALCULATOR ENGINE =====================
function roundClean(n){
  if (!isFinite(n)) return 0;
  return Math.round(n*1e6)/1e6;
}
function previewCalc(expr){
  // Only preview once the expression looks complete — not while it still ends in an
  // operator/dot or has unmatched parentheses, so the live number doesn't flicker
  // or mislead mid-typing.
  const trimmed = (expr||'').trim();
  if (!trimmed) return null;
  if (/[+\-*/.]$/.test(trimmed)) return null;
  const openCount = (trimmed.match(/\(/g)||[]).length;
  const closeCount = (trimmed.match(/\)/g)||[]).length;
  if (openCount !== closeCount) return null;
  const r = evalExpr(trimmed);
  if (!isFinite(r)) return null;
  return roundClean(r);
}

function evalExpr(expr){
  if (!expr) return 0;
  const tokens = expr.match(/(\d+\.?\d*)|[+\-*/()]/g);
  if (!tokens) return 0;
  let pos = 0;
  const peek = () => tokens[pos];
  const next = () => tokens[pos++];
  function parseExpr(){ let v=parseTerm(); while(peek()==='+'||peek()==='-'){const op=next(); const r=parseTerm(); v = op==='+'? v+r : v-r;} return v; }
  function parseTerm(){ let v=parseFactor(); while(peek()==='*'||peek()==='/'){const op=next(); const r=parseFactor(); v = op==='*'? v*r : v/r;} return v; }
  function parseFactor(){
    if (peek()==='('){ next(); const v=parseExpr(); if(peek()===')') next(); return v; }
    if (peek()==='-'){ next(); return -parseFactor(); }
    return parseFloat(next());
  }
  try { const r = parseExpr(); return isFinite(r)? r : 0; } catch { return 0; }
}

function attachPhotoZoomHandlers(){
  const img = document.getElementById('photo-modal-img');
  const wrap = document.getElementById('photo-modal-wrap');
  if (!img || !wrap) return;
  let scale = 1, lastScale = 1, startDist = 0, lastTapTime = 0;

  function setTransform(originX, originY){
    if (originX!=null) img.style.transformOrigin = `${originX}% ${originY}%`;
    img.style.transform = `scale(${scale})`;
  }

  wrap.addEventListener('touchstart', (e)=>{
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      startDist = Math.hypot(dx, dy);
      lastScale = scale;
      const rect = img.getBoundingClientRect();
      const midX = (e.touches[0].clientX + e.touches[1].clientX)/2;
      const midY = (e.touches[0].clientY + e.touches[1].clientY)/2;
      const originX = Math.min(100, Math.max(0, ((midX-rect.left)/rect.width)*100));
      const originY = Math.min(100, Math.max(0, ((midY-rect.top)/rect.height)*100));
      setTransform(originX, originY);
    }
  }, { passive:true });

  wrap.addEventListener('touchmove', (e)=>{
    if (e.touches.length === 2) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.hypot(dx, dy);
      scale = Math.min(4, Math.max(1, lastScale * (dist / (startDist||dist))));
      setTransform();
    }
  }, { passive:false });

  wrap.addEventListener('touchend', (e)=>{
    if (e.touches.length === 0) {
      const now = Date.now();
      if (now - lastTapTime < 300) {
        scale = scale > 1 ? 1 : 2.5;
        setTransform(50, 50);
      }
      lastTapTime = now;
    }
  });
}

  toastMsg = msg;
  toastUndo = undoAction ? { action: undoAction } : null;
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ toastMsg=null; toastUndo=null; render(); }, undoAction ? 6000 : 1800);
}
function runUndo(){
  if (!toastUndo) return;
  const action = toastUndo.action;
  clearTimeout(toastTimer);
  toastMsg = null; toastUndo = null;
  action();
  render();
}

function monthKey(dateStr){
  const d = new Date(dateStr);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  return new Date(y, m-1, 1).toLocaleDateString('en-IN', { month:'short' });
}
function computeStats(range){
  range = range || '6m';
  const now = new Date();
  const months = [];
  if (range === 'year'){
    for (let m=0; m<=now.getMonth(); m++){
      const d = new Date(now.getFullYear(), m, 1);
      const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
      months.push({ key, label: monthLabel(key), amount: 0 });
    }
  } else {
    for (let i=5;i>=0;i--){
      const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
      const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
      months.push({ key, label: monthLabel(key), amount: 0 });
    }
  }
  const monthMap = {}; months.forEach(m=> { monthMap[m.key]=m; m.entries = []; });

  const itemQty = {};
  const dueByCustomer = [];
  let totalDue = 0, totalCollected = 0, totalCustomersWithDue = 0;

  state.customers.forEach(c=>{
    const txns = loadTxns(c.id);
    let custDue = 0;
    txns.forEach(t=>{
      const m = txnMath(t);
      custDue += m.due;
      totalCollected += m.paid;
      const advKey = monthKey(t.dateGiven);
      if (Number(t.advance) > 0 && monthMap[advKey]) {
        monthMap[advKey].amount += Number(t.advance);
        monthMap[advKey].entries.push({ date: t.dateGiven, amount: Number(t.advance), customer: c.name, type: 'advance' });
      }
      (t.payments||[]).forEach(p=>{
        const pKey = monthKey(p.date);
        if (monthMap[pKey]) {
          monthMap[pKey].amount += Number(p.amount);
          monthMap[pKey].entries.push({ date: p.date, amount: Number(p.amount), customer: c.name, type: 'payment' });
        }
      });
      (t.items||[]).forEach(it=>{
        itemQty[it.product] = (itemQty[it.product]||0) + Number(it.qty);
      });
    });
    totalDue += custDue;
    if (custDue > 0){ dueByCustomer.push({ name: c.name, due: custDue }); totalCustomersWithDue++; }
  });

  months.forEach(m=> m.entries.sort((a,b)=> new Date(a.date) - new Date(b.date)));

  dueByCustomer.sort((a,b)=> b.due-a.due);
  const topDues = dueByCustomer.slice(0,5);

  const topItems = Object.entries(itemQty).sort((a,b)=> b[1]-a[1]).slice(0,6);

  return { months, totalDue, totalCollected, totalCustomersWithDue, topDues, topItems };
}

// ---------- Stock tracker ----------
function computeStockUsage(){
  const out = {};
  state.customers.forEach(c=>{
    loadTxns(c.id).forEach(t=>{
      const m = txnMath(t);
      if (m.notYetStarted) return;
      m.items.forEach(i=>{ if (i.remaining>0) out[i.product] = (out[i.product]||0) + i.remaining; });
    });
  });
  return out;
}
function renderStock(){
  const stock = loadStock();
  const out = computeStockUsage();
  const allProducts = Array.from(new Set([...Object.keys(stock), ...Object.keys(out)])).sort();
  return `
  <div class="px-4 pt-2 pb-6">

function summarizeOutstanding(txns){
  if (txns.length===0) return null; // no entries at all yet — show nothing
  const totals = {};
  const bookedTotals = {};
  txns.forEach(t=>{
    const m = txnMath(t);
    m.items.forEach(i=>{
      if (i.remaining <= 0) return;
      if (m.notYetStarted) bookedTotals[i.product] = (bookedTotals[i.product]||0) + i.remaining;
      else totals[i.product] = (totals[i.product]||0) + i.remaining;
    });
  });
  const parts = Object.entries(totals).map(([product,qty]) => `${product} ×${qty}`);
  const bookedParts = Object.entries(bookedTotals).map(([product,qty]) => `${product} ×${qty}`);
  if (parts.length===0 && bookedParts.length===0) return { text: 'All returned', color: 'text-[#22C58B]' };
  const lines = [];
  if (parts.length>0) {
    const text = parts.join(', ');
    lines.push({ text: text.length>60 ? text.slice(0,58)+'…' : text, color: 'text-[#F0776F] font-medium', prefix: `${iconSpan('package',11)} Out: ` });
  }
  if (bookedParts.length>0) {
    const text = bookedParts.join(', ');
    lines.push({ text: text.length>60 ? text.slice(0,58)+'…' : text, color: 'text-[#4C8DF5]', prefix: `${iconSpan('calendar',11)} Booked: ` });
  }
  return lines;
}

function getCustomerCreatedTime(c){
  const n = Number(String(c.id).replace(/^c/, ''));
  return isNaN(n) ? 0 : n;
}

function getCustomerLastActivity(c, txns){
  let latest = getCustomerCreatedTime(c);
  txns.forEach(t=>{
    (t.history||[]).forEach(h=>{
      const ts = new Date(h.ts).getTime();
      if (ts > latest) latest = ts;
    });
  });
  return latest;
}

function customerDueInfo(txns){
  let earliestOngoing = null, earliestBooked = null;
  txns.forEach(t=>{
    const m = txnMath(t);
    if (m.notYetStarted) {
      if (!earliestBooked || new Date(t.dateGiven) < new Date(earliestBooked.dateGiven)) earliestBooked = t;
    } else if (m.due > 0) {
      if (!earliestOngoing || new Date(t.dateGiven) < new Date(earliestOngoing.dateGiven)) earliestOngoing = t;
    }
  });
  if (earliestOngoing) return { type:'due', days: daysBetween(earliestOngoing.dateGiven, nowISO()), date: earliestOngoing.dateGiven };
  if (earliestBooked) return { type:'booked', date: earliestBooked.dateGiven };
  return null;
}

const OVERDUE_DAYS = 10;
function customerOverdueDays(txns){
  let maxDays = 0;
  txns.forEach(t=>{
    const m = txnMath(t);
    if (m.notYetStarted || m.allReturned) return;
    const d = daysBetween(t.dateGiven, nowISO());
    if (d > maxDays) maxDays = d;
  });
  return maxDays;
}
function renderCustomerListBody(){
  const searchTerm = state.search.toLowerCase().trim();
  const filtered = state.customers.filter(c=>{
    if (!searchTerm) return true;
    if (c.name.toLowerCase().includes(searchTerm)) return true;
    const t = loadTxns(c.id);
    return t.some(tx => txnMath(tx).items.some(i=> i.remaining>0 && i.product.toLowerCase().includes(searchTerm)));
  });
  const dues = {};
  const outstanding = {};
  const lastActivity = {};
  const overdueDays = {};
  const dueInfo = {};
  filtered.forEach(c=>{
    const t = loadTxns(c.id);
    dues[c.id] = t.reduce((s,tx)=> s + txnMath(tx).due, 0);
    outstanding[c.id] = summarizeOutstanding(t);
    lastActivity[c.id] = getCustomerLastActivity(c, t);
    overdueDays[c.id] = customerOverdueDays(t);
    dueInfo[c.id] = customerDueInfo(t);
  });
  // Customers with any due or advance bubble up, sorted by most recent activity first.
  // Fully-settled ("Clear") customers sink to the bottom, also most-recent-first within that group.
  const sorted = [...filtered].sort((a,b)=>{
    const aClear = (dues[a.id] ?? 0) === 0 ? 1 : 0;
    const bClear = (dues[b.id] ?? 0) === 0 ? 1 : 0;
    if (aClear !== bClear) return aClear - bClear;
    return lastActivity[b.id] - lastActivity[a.id];
  });
  if (sorted.length===0) {
    return searchTerm ? `<div class="text-center text-[#8993A8] mt-16 px-6 ml-2">
      ${iconSpan('search',28)}
      <p class="ink text-lg mt-3">No matches for "${esc(state.search.trim())}"</p>
      <p class="text-sm mt-1">Try a different name or item.</p>
    </div>` : `<div class="text-center text-[#8993A8] mt-16 px-6 ml-2">
      <p class="ink text-lg">Khaali panna — page is empty</p>
      <p class="text-sm mt-1">Add a customer to start their ledger.</p>
    </div>`;
  }
  return `<div class="space-y-1 ml-2">
    ${sorted.map(c=>{
      const due = dues[c.id] ?? 0;
      const dueTxt = due>0 ? `₹${due.toLocaleString('en-IN')} due` : due<0 ? `₹${Math.abs(due).toLocaleString('en-IN')} adv` : 'Clear';
      const dueColor = due>0 ? 'text-[#E14B4B]' : due<0 ? 'text-[#22C58B]' : 'text-[#8993A8]';
      const out = outstanding[c.id];
      const outLines = !out ? '' : Array.isArray(out)
        ? out.map(l => `<p class="text-[11px] ${l.color} mt-0.5">${l.prefix}${esc(l.text)}</p>`).join('')
        : `<p class="text-[11px] ${out.color} mt-0.5">✓ All returned</p>`;
      const isOverdue = overdueDays[c.id] >= OVERDUE_DAYS;
      const info = dueInfo[c.id];
      const daysLine = (info && info.type!=='booked')
        ? `<p class="text-[11px] mt-0.5 ${isOverdue ? 'text-[#E14B4B] font-semibold' : 'text-[#8993A8]'}">${iconSpan('clock',11)} ${info.days}d</p>`
        : '';
      const dueSubtext = info
        ? (info.type==='booked'
            ? `<p class="text-xs text-[#4C8DF5] font-semibold mt-0.5 whitespace-nowrap">${iconSpan('calendar',12)} Booked ${fmtDateOnly(info.date)}</p>`
            : `<p class="text-xs font-semibold mt-0.5 whitespace-nowrap ${isOverdue ? 'text-[#E14B4B]' : 'text-[#8993A8]'}">since ${fmtDateOnly(info.date)}</p>`)
        : '';
      return `
      <button data-open-customer="${c.id}" class="w-full flex items-center justify-between border-b border-dashed border-[#E7EAF2]/25 px-2 py-3 text-left active:bg-[#E7EAF2]/5">
        <div class="pr-3">
          <p class="ink text-lg font-bold text-[#E7EAF2] leading-tight">${esc(c.name)}</p>
          ${c.phone ? `<p class="text-xs text-[#8993A8] mt-0.5">${iconSpan('phone',12)} ${esc(c.phone)}</p>` : ''}
          ${daysLine}
          ${outLines}
        </div>
        <div class="text-right">
          <p class="mono text-sm font-bold ${dueColor} whitespace-nowrap">${dueTxt}</p>
          ${dueSubtext}
        </div>
      </button>`;
    }).join('')}
  </div>`;
}

function computeVirtualDueMap(txns){
  // The collapsed row (and the expanded entry view) each show "what's still owed for
  // this entry" — but money paid doesn't always land on the entry it conceptually
  // belongs to (e.g. a payment made while only one entry existed, before a newer entry
  // was added later). So for DISPLAY only (never touching the actual stored payments),
  // pool up everything paid across all entries and apply it oldest-total-first — this
  // is just how the per-entry number is shown, not a change to any stored data or to
  // the real Total/Paid/Due summary at the top of the customer page.
  const oldestFirst = [...txns].sort((a,b)=> new Date(a.dateGiven) - new Date(b.dateGiven));
  let pool = oldestFirst.reduce((s,t)=> s + txnMath(t).paid, 0);
  const virtualDue = {};
  oldestFirst.forEach(t=>{
    const total = txnMath(t).total;
    const applied = Math.min(pool, total);
    virtualDue[t.id] = total - applied;
    pool -= applied;
  });
  if (pool > 0 && oldestFirst.length>0) virtualDue[oldestFirst[oldestFirst.length-1].id] -= pool;
  return virtualDue;
}

// ---------- Add Transaction ----------
function initTxnForm(){
  const simpleQty = {}, simpleRate = {};
  PRODUCT_CONFIG.forEach(p=>{ if(!p.sizes){ simpleQty[p.name]=''; simpleRate[p.name]=getRate(p.name)||''; } });
  const sizeRows = {};
  PRODUCT_CONFIG.forEach(p=>{ if(p.sizes){ sizeRows[p.name] = p.sizes.map((label,i)=>({id:p.name+'-'+i,label,qty:'',rate:getRate(p.name)||''})); } });
  txnForm = { simpleQty, simpleRate, customName:'', sizeRows, dateGiven: nowLocalInput(), hasReturnDate:false, dateReturned: nowLocalInput(), advance:'', manualDays:'', manualTotal:'', photo:null };
  mrHelper = { open:false, qty:'', monthlyRent:'', months:'' };
}

function computeTxnItems(){
  const items = [];
  PRODUCT_CONFIG.forEach(p=>{
    if (p.sizes){
      (txnForm.sizeRows[p.name]||[]).forEach(row=>{
        const qty = Number(row.qty||0);
        if (qty>0 && row.label.trim()) items.push({ product:`${p.name} (${row.label.trim()})`, qty, rate:Number(row.rate||0) });
      });
    } else if (p.name!=='Other'){
      const qty = Number(txnForm.simpleQty[p.name]||0);
      if (qty>0) items.push({ product:p.name, qty, rate:Number(txnForm.simpleRate[p.name]||0) });
    }
  });
  const otherQty = Number(txnForm.simpleQty['Other']||0);
  if (otherQty>0 && txnForm.customName.trim()) items.push({ product:txnForm.customName.trim(), qty:otherQty, rate:Number(txnForm.simpleRate['Other']||0) });
  return items;
}

function buildAddPreviewTxn(){
  const rawItems = computeTxnItems();
  const items = rawItems.map(i => ({
    ...i,
    returns: txnForm.hasReturnDate ? [{ qty: i.qty, date: txnForm.dateReturned }] : []
  }));
  return { dateGiven: txnForm.dateGiven, items, payments: [], advance: 0, waived: 0, manualDays: txnForm.manualDays ? Number(txnForm.manualDays) : null, manualTotal: txnForm.manualTotal ? Number(txnForm.manualTotal) : null };
}

function estimateReturnDays(){
  const closed = state.txns.filter(t=>{
    const m = txnMath(t);
    return m.status === 'returned' && !m.notYetStarted;
  });
  if (closed.length === 0) return null;
  const avg = closed.reduce((s,t)=> s + txnMath(t).days, 0) / closed.length;
  return Math.max(1, Math.round(avg));
}

function renderTxnPreviewBlock(){
  const items = computeTxnItems();
  if (items.length===0) return '';
  const m = txnMath(buildAddPreviewTxn());
  const dayLabel = m.manualDays!=null ? 'Days (manually set)' : (txnForm.hasReturnDate?'Days on rent':'Days so far (ongoing)');

  if (m.manualTotal != null){
    const itemLines2 = items.map(i => `
        <div class="flex justify-between text-[11px] text-[#8993A8] mb-1">
          <span>${esc(i.product)} ×${i.qty}</span>
          <span class="mono text-[#E7EAF2]">₹${displayItemTotal(i, m).toLocaleString('en-IN')} (share)</span>
        </div>`).join('');
    return `
      <div class="border-2 border-[#4C8DF5]/30 rounded-lg p-4 mb-6 bg-[#4C8DF5]/5">
        <p class="text-xs text-[#4C8DF5] font-semibold mb-2">${iconSpan('calculator',13)} Flat total set — day/rate math below is ignored for billing</p>
        ${itemLines2}
        <div class="flex justify-between text-sm font-bold pt-2 border-t border-dashed border-[#4C8DF5]/20 mt-2"><span class="text-[#E7EAF2]">Total (flat)</span><span class="mono text-[#E14B4B]">₹${m.total.toLocaleString('en-IN')}</span></div>
      </div>`;
  }

  const itemLines = items.map(i => `
        <div class="flex justify-between text-[11px] text-[#8993A8] mb-1">
          <span>${esc(i.product)} ×${i.qty} @ ₹${i.rate}/day</span>
          <span class="mono text-[#E7EAF2]">₹${(i.qty*i.rate*m.days).toLocaleString('en-IN')}</span>
        </div>`).join('');
  const estDays = (!txnForm.hasReturnDate && m.manualDays==null) ? estimateReturnDays() : null;
  const estLine = estDays ? `
        <div class="flex justify-between text-[11px] text-[#8993A8] mb-1 mt-2 pt-2 border-t border-dashed border-[#E7EAF2]/20">
          <span>${iconSpan('calendar',13)} Usually returns in ~${estDays}d (this customer's average)</span>
          <span class="mono text-[#E7EAF2]">${fmtDateOnly(addDaysToDate(nowISO(), estDays))}</span>
        </div>` : '';
  return `
      <div class="border-2 border-[#E7EAF2]/20 rounded-lg p-4 mb-6 bg-[#131B2E]/60">
        ${itemLines}
        <div class="flex justify-between text-xs text-[#8993A8] mb-1 mt-2 pt-2 border-t border-dashed border-[#E7EAF2]/20"><span>Cost per day (all items)</span><span class="mono text-[#E7EAF2]">₹${m.perDayCost.toLocaleString('en-IN')}</span></div>
        <div class="flex justify-between text-xs text-[#8993A8] mb-1"><span>${dayLabel}</span><span class="mono text-[#E7EAF2]">${m.days}d</span></div>
        <div class="flex justify-between text-sm font-bold pt-2 border-t border-dashed border-[#E7EAF2]/20 mt-2"><span class="text-[#E7EAF2]">Total</span><span class="mono text-[#E14B4B]">₹${m.total.toLocaleString('en-IN')}</span></div>
        ${estLine}
      </div>`;
}

function updateTxnLive(){
  const slot = document.getElementById('txn-preview-slot');
  if (slot) slot.innerHTML = renderTxnPreviewBlock();
  const saveBtn = document.getElementById('btn-save-txn');
  if (saveBtn) {
    const items = computeTxnItems();
    saveBtn.disabled = items.length===0;
    saveBtn.classList.toggle('opacity-40', items.length===0);
  }
}

function renderMrHelperResult(isEdit){
  const qty = Number(mrHelper.qty)||0;
  const rent = Number(mrHelper.monthlyRent)||0;
  const months = Number(mrHelper.months)||0;
  if (!(rent>0 && months>0)) return '';
  const totalDays = months*30;
  const total = roundClean(rent*months);
  const perUnitDay = qty>0 ? roundClean(rent/qty/30) : null;
  return `
    <div class="rounded-lg bg-[#131B2E] border border-[#E7EAF2]/10 px-3 py-2.5 space-y-1.5">
      <div class="flex justify-between"><span class="text-xs text-[#8993A8]">Total for ${months} month${months===1?'':'s'}</span><span class="text-sm font-bold text-[#E7EAF2] mono">₹${total.toLocaleString('en-IN')}</span></div>
      ${perUnitDay!=null ? `<div class="flex justify-between text-xs"><span class="text-[#8993A8]">Equivalent rate — type this into the item's Rate ₹/day field below</span></div>
      <div class="flex justify-between items-center"><span class="text-sm font-bold text-[#4C8DF5] mono">₹${perUnitDay} /day/item</span></div>` : ''}

}

    advance: String(t.advance||0),
    manualDays: t.manualDays!=null ? String(t.manualDays) : '',

}

function computeEditItems(){
  return editTxnForm.items
    .filter(row => Number(row.qty||0) > 0 && row.product.trim())
    .map(row => ({ product: row.product.trim(), qty: Number(row.qty), rate: Number(row.rate||0), returns: row.returns||[] }));
}

function renderMonthlyRentResult(){
  const qty = Number(monthlyRentCalc.qty)||0;
  const rent = Number(monthlyRentCalc.monthlyRent)||0;
  const months = Number(monthlyRentCalc.months)||0;
  if (!(rent>0 && months>0)) return '';
  const total = roundClean(rent*months);
  const perUnitMonth = qty>0 ? roundClean(rent/qty) : null;
  const perUnitDay = qty>0 ? roundClean(rent/qty/30) : null;
  return `
    <div class="rounded-lg bg-[#131B2E]/60 border border-[#E7EAF2]/10 px-3 py-2.5 space-y-1.5">
      <div class="flex justify-between"><span class="text-xs text-[#8993A8]">Total for ${months} month${months===1?'':'s'}</span><span class="text-base font-bold text-[#E7EAF2] mono">₹${total.toLocaleString('en-IN')}</span></div>
      ${perUnitMonth!=null ? `<div class="flex justify-between text-xs pt-1.5 border-t border-dashed border-[#E7EAF2]/15"><span class="text-[#8993A8]">Per item, per month</span><span class="text-[#E7EAF2] mono">₹${perUnitMonth}</span></div>` : ''}
      ${perUnitDay!=null ? `<div class="flex justify-between text-xs"><span class="text-[#8993A8]">Per item, per day (approx., 30-day month)</span><span class="text-[#E7EAF2] mono">₹${perUnitDay}</span></div>` : ''}
    </div>`;
}
function renderAddDaysResult(){
  if (!(dateCalcAdd.date && dateCalcAdd.days!=='')) return '';
  return `
    <div class="rounded-lg bg-[#131B2E]/60 border border-[#E7EAF2]/10 px-3 py-2">
      <p class="text-xs text-[#8993A8]">${Number(dateCalcAdd.days)>=0?'That date will be':'That was'}</p>
      <p class="text-base font-bold text-[#E7EAF2] mono">${fmtDateOnly(addDaysToDate(dateCalcAdd.date, Number(dateCalcAdd.days)))}</p>
    </div>`;
}
function renderBetweenDaysResult(){
  if (!(dateCalcBetween.dateA && dateCalcBetween.dateB)) return '';
  const gap = daysBetween(dateCalcBetween.dateA, dateCalcBetween.dateB) || daysBetween(dateCalcBetween.dateB, dateCalcBetween.dateA);
  return `
    <div class="rounded-lg bg-[#131B2E]/60 border border-[#E7EAF2]/10 px-3 py-2">
      <p class="text-xs text-[#8993A8]">Gap</p>
      <p class="text-base font-bold text-[#E7EAF2] mono">${gap} days</p>
    </div>`;
}

// ===================== EVENT HANDLERS =====================
function attachHandlers(){
  const $ = sel => document.querySelector(sel);
  const $$ = sel => document.querySelectorAll(sel);

  $('#btn-toast-undo')?.addEventListener('click', runUndo);

  $('#nav-customers')?.addEventListener('click', ()=>{ state.tab='customers'; state.screen='list'; render(); });
  $('#nav-stats')?.addEventListener('click', ()=>{ state.tab='stats'; state.screen='list'; render(); });
  $('[data-goto-booked]')?.addEventListener('click', ()=>{ state.tab='stats'; state.screen='booked'; render(); });
  $('#nav-calc')?.addEventListener('click', ()=>{ state.tab='calc'; render(); });
  $('#btn-back')?.addEventListener('click', ()=>{
    if (state.screen==='add-txn' || state.screen==='edit-txn') { txnForm=null; editTxnForm=null; state.screen='customer'; }
    else if (state.screen==='edit-customer') { editCustForm=null; state.screen='customer'; }
    else if (state.screen==='customer' || state.screen==='add-customer') { state.screen='list'; }
    else if (state.tab==='stats' && ['stock','ratecard','booked'].includes(state.screen)) { state.screen='list'; }
    else { state.screen = state.tab==='calc' ? 'calc' : 'list'; }
    render();
  });

  $('#btn-export')?.addEventListener('click', exportBackup);
  $('#btn-goto-stock')?.addEventListener('click', ()=>{ state.screen='stock'; render(); });
  $('#btn-range-6m')?.addEventListener('click', ()=>{ statsRange='6m'; statsSelectedMonth=null; render(); });
  $('#btn-range-year')?.addEventListener('click', ()=>{ statsRange='year'; statsSelectedMonth=null; render(); });
  $$('[data-month-key]').forEach(b=> b.addEventListener('click', ()=>{
    const key = b.getAttribute('data-month-key');
    statsSelectedMonth = (statsSelectedMonth===key) ? null : key;
    render();
  }));
  $('#btn-goto-ratecard')?.addEventListener('click', ()=>{ state.screen='ratecard'; render(); });
  $('#btn-goto-booked')?.addEventListener('click', ()=>{ state.screen='booked'; render(); });
  $('#btn-download-report')?.addEventListener('click', downloadReport);
  $('#btn-toggle-numerals')?.addEventListener('click', ()=>{
    saveNumeralStyle(loadNumeralStyle()==='deva' ? 'latin' : 'deva');
    render();
  });
  document.querySelectorAll('[data-stock-input]').forEach(inp=> inp.addEventListener('change', (e)=>{
    const stock = loadStock();
    stock[e.target.getAttribute('data-stock-input')] = Number(e.target.value)||0;
    saveStock(stock);
    render();
  }));
  document.querySelectorAll('[data-rate-input]').forEach(inp=> inp.addEventListener('change', (e)=>{
    const rates = loadRates();
    rates[e.target.getAttribute('data-rate-input')] = Number(e.target.value)||0;
    saveRates(rates);
    render();
  }));
  $('#btn-stock-add')?.addEventListener('click', ()=>{
    const name = document.getElementById('stock-new-name')?.value.trim();
    if (!name) return;
    const stock = loadStock();
    if (!(name in stock)) stock[name] = 0;
    saveStock(stock);
    render();
  });
  document.querySelectorAll('[data-open-customer-booked]').forEach(b=> b.addEventListener('click', ()=>{
    state.tab='customers';
    state.activeCustomerId = b.getAttribute('data-open-customer-booked');
    state.txns = loadTxns(state.activeCustomerId);
    state.openTxnId = null;
    state.screen = 'customer';
    render();
  }));
  $('#import-file')?.addEventListener('change', (e)=>{ if(e.target.files[0]) importBackupFile(e.target.files[0]); e.target.value=''; });

  $('#search-input')?.addEventListener('input', (e)=>{
    state.search = e.target.value;
    const body = document.getElementById('customer-list-body');
    if (body) { body.innerHTML = renderCustomerListBody(); bindOpenCustomerButtons(); }
  });

  $$('[data-open-customer]').forEach(b=> b.addEventListener('click', ()=>{
    state.activeCustomerId = b.getAttribute('data-open-customer');
    state.txns = loadTxns(state.activeCustomerId);
    state.openTxnId = null;
    state.screen = 'customer';
    render();
  }));

  $('#btn-add-customer')?.addEventListener('click', ()=>{ custForm={name:'',phone:'',address:'',note:'',photo:null}; state.screen='add-customer'; render(); });
  $('#btn-cancel-customer')?.addEventListener('click', ()=>{ state.screen='list'; render(); });
  $('#f-name')?.addEventListener('input', e=>custForm.name=e.target.value);
  $('#f-phone')?.addEventListener('input', e=>custForm.phone=e.target.value);
  $('#f-address')?.addEventListener('input', e=>custForm.address=e.target.value);
  $('#f-note')?.addEventListener('input', e=>custForm.note=e.target.value);
  $('#f-photo')?.addEventListener('change', async e=>{
    const file = e.target.files[0];
    if (!file) return;
    try { custForm.photo = await resizeImageForStorage(file); render(); }
    catch(err) { showToast('Photo could not be loaded'); }
  });
  $('#btn-remove-photo')?.addEventListener('click', ()=>{ custForm.photo=null; render(); });
  $('#btn-save-customer')?.addEventListener('click', ()=>{
    if(!custForm.name.trim()) return;
    const nameTrim = custForm.name.trim();
    const phoneTrim = custForm.phone.trim();
    const dupByPhone = phoneTrim && state.customers.find(c=>c.phone && c.phone.trim()===phoneTrim);
    const dupByName = state.customers.find(c=>c.name.trim().toLowerCase()===nameTrim.toLowerCase());
    if (dupByPhone) {
      if (!confirm(`"${dupByPhone.name}" already has this phone number saved. Add "${nameTrim}" anyway?`)) return;
    } else if (dupByName) {
      if (!confirm(`A customer named "${dupByName.name}" already exists. Add another one with the same name?`)) return;
    }
    const c = { id:makeId('c'), name:nameTrim, phone:phoneTrim, address:custForm.address.trim(), note:(custForm.note||'').trim(), photo: custForm.photo||null };
    state.customers = [...state.customers, c];
    saveCustomers(state.customers);
    // Go straight into adding their first rental entry — no need to scroll and find them in the list.
    state.activeCustomerId = c.id;
    state.txns = [];
    state.openTxnId = null;
    initTxnForm();
    state.screen = 'add-txn';
    showToast(c.name + ' added — now add their first entry');
  });

  $('#btn-add-txn')?.addEventListener('click', ()=>{ initTxnForm(); state.screen='add-txn'; render(); });

  $('#btn-share-khata')?.addEventListener('click', async ()=>{
    const c = getActiveCustomer();
    try { await Promise.all([
      document.fonts.load("bold 40px 'Noto Sans Devanagari'"),
      document.fonts.load("18px 'Noto Sans Devanagari'"),
    ]); } catch(e) {}
    const canvas = buildReceiptCanvas(c, getBillEntries(state.txns), true);
    shareCanvasAsImage(canvas, `bill-${c.name.replace(/\s+/g,'-')}.png`, `Bill — ${c.name}`);
  });

  $('#btn-whatsapp-customer')?.addEventListener('click', ()=>{
    const c = getActiveCustomer();

  $('#btn-add-payment-customer')?.addEventListener('click', ()=>{
    const input = document.getElementById('cust-pay-amt');
    const amt = parseFloat(input.value);
    if (!amt || amt<=0) return;
    // Apply the payment to the oldest outstanding entries first (FIFO), so the customer
    // doesn't need to know or care which specific rental entry it's "for".
    const dueTxns = state.txns
      .map(t => ({ t, m: txnMath(t) }))
      .filter(x => x.m.due > 0)
      .sort((a,b) => new Date(a.t.dateGiven) - new Date(b.t.dateGiven));
    let remaining = amt;
    dueTxns.forEach(({t, m}) => {
      if (remaining <= 0) return;
      const applyAmt = Math.min(remaining, m.due);
      t.payments = [...(t.payments||[]), { amount: applyAmt, date: nowISO() }];
      t.history = [...(t.history||[]), { ts: nowISO(), note: `Payment ₹${applyAmt.toLocaleString('en-IN')} recorded` }];
      remaining -= applyAmt;
    });
    if (remaining > 0 && state.txns.length > 0) {
      // Paid more than the total due — credit the extra to the most recent entry as an advance.
      const last = state.txns[state.txns.length - 1];
      last.payments = [...(last.payments||[]), { amount: remaining, date: nowISO() }];
      last.history = [...(last.history||[]), { ts: nowISO(), note: `Payment ₹${remaining.toLocaleString('en-IN')} recorded (advance, no due left)` }];
    }
    saveTxns(state.activeCustomerId, state.txns);
    showToast(`₹${amt.toLocaleString('en-IN')} payment added`);
  });

  $$('[data-calc-key]').forEach(b=> b.addEventListener('click', ()=>{
    const k = b.getAttribute('data-calc-key');
    const isOp = ['+','-','*','/'].includes(k);

    if (k==='C'){
      calcState.expr=''; calcState.result=null;
    }
    else if (k==='⌫'){
      calcState.expr = calcState.expr.slice(0,-1);
      calcState.result=null;
    }
    else if (k==='='){
      if (!calcState.expr) { render(); return; }
      const r = roundClean(evalExpr(calcState.expr));
      calcState.history = [...calcState.history, { expr: calcState.expr, result: r }].slice(-8);
      calcState.result = r;
      calcState.expr = String(r);
    }
    else if (k==='MC'){ calcState.memory = 0; }
    else if (k==='MR'){
      if (calcState.result!==null) calcState.expr = '';
      calcState.expr += String(calcState.memory);
      calcState.result = null;
    }
    else if (k==='M+' || k==='M-'){
      const v = calcState.result!==null ? calcState.result : previewCalc(calcState.expr);
      if (v!=null) calcState.memory = roundClean(calcState.memory + (k==='M+' ? v : -v));
    }
    else if (k==='%'){
      const v = previewCalc(calcState.expr);
      if (v!=null){ calcState.expr = String(roundClean(v/100)); calcState.result=null; }
    }
    else if (k==='±'){
      const m = calcState.expr.match(/(-?\d+\.?\d*)$/);
      if (m){
        const num = m[1];
        const flipped = num.startsWith('-') ? num.slice(1) : '-'+num;
        calcState.expr = calcState.expr.slice(0, calcState.expr.length-num.length) + flipped;
      }
      calcState.result=null;
    }
    else if (isOp){
      if (calcState.result!==null){ calcState.expr = String(calcState.result); calcState.result=null; }
      if (calcState.expr==='' ){
        if (k==='-') calcState.expr = '-'; // allow starting a negative number
      } else if (/[+\-*/]-?$/.test(calcState.expr)){
        // an operator (optionally with a pending unary minus) is already at the end —
        // replace it instead of stacking, but still allow "5*-3" style negative numbers
        if (k==='-' && !calcState.expr.endsWith('-')) calcState.expr += '-';
        else calcState.expr = calcState.expr.replace(/[+\-*/]-?$/, k);
      } else {
        calcState.expr += k;
      }
    }
    else if (k==='.'){
      if (calcState.result!==null){ calcState.expr=''; calcState.result=null; }
      const seg = calcState.expr.split(/[+\-*/()]/).pop();
      if (!seg.includes('.')) calcState.expr += (seg==='' ? '0.' : '.');
    }
    else if (k==='('){
      if (calcState.result!==null){ calcState.expr=''; calcState.result=null; }
      // implicit multiplication if a number or ")" precedes, so the expression stays valid
      calcState.expr += /[\d)]$/.test(calcState.expr) ? '*(' : '(';
    }
    else if (k===')'){
      const openCount = (calcState.expr.match(/\(/g)||[]).length;
      const closeCount = (calcState.expr.match(/\)/g)||[]).length;
      if (openCount > closeCount && /[\d)]$/.test(calcState.expr)) calcState.expr += ')';
    }
    else {
      // digits
      if (calcState.result!==null){ calcState.expr=''; calcState.result=null; }
      calcState.expr += k;
    }
    render();
  }));

  $('#dc-add-date')?.addEventListener('input', e=>{ dateCalcAdd.date = e.target.value; const el=document.getElementById('dc-add-result'); if (el) el.innerHTML = renderAddDaysResult(); });
  $('#dc-add-days')?.addEventListener('input', e=>{ dateCalcAdd.days = e.target.value; const el=document.getElementById('dc-add-result'); if (el) el.innerHTML = renderAddDaysResult(); });
  $('#dc-between-a')?.addEventListener('input', e=>{ dateCalcBetween.dateA = e.target.value; const el=document.getElementById('dc-between-result'); if (el) el.innerHTML = renderBetweenDaysResult(); });
  $('#dc-between-b')?.addEventListener('input', e=>{ dateCalcBetween.dateB = e.target.value; const el=document.getElementById('dc-between-result'); if (el) el.innerHTML = renderBetweenDaysResult(); });
  $('#mr-qty')?.addEventListener('input', e=>{ monthlyRentCalc.qty = e.target.value; const el=document.getElementById('mr-result'); if (el) el.innerHTML = renderMonthlyRentResult(); });
  $('#mr-rent')?.addEventListener('input', e=>{ monthlyRentCalc.monthlyRent = e.target.value; const el=document.getElementById('mr-result'); if (el) el.innerHTML = renderMonthlyRentResult(); });
  $('#mr-months')?.addEventListener('input', e=>{ monthlyRentCalc.months = e.target.value; const el=document.getElementById('mr-result'); if (el) el.innerHTML = renderMonthlyRentResult(); });
}

// Lightweight re-render that preserves focus for text inputs while typing in Add Txn form
function renderLive(){
  // re-render but keep same screen; full render is cheap enough for this app size
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && active.selectionStart;
  render();
  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) { el.focus(); if (selStart!=null && el.setSelectionRange) { try{ el.setSelectionRange(selStart, selStart);}catch{} } }
  }
}

render();
